<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>NephroPredict</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <h1>🩺 NephroPredict</h1>
        <h2>🌿 Early Detection of Chronic Kidney Disease</h2>
        <form method="POST">
            <div class="row">
                <div class="col-50">
                    <label>Age (years)</label>
                    <input type="number" name="Age" value="45" min="1" max="120" required>

                    <label>Gender</label>
                    <select name="Gender">
                        <option value="Male">Male</option>
                        <option value="Female">Female</option>
                    </select>

                    <label>BMI</label>
                    <input type="number" step="0.1" name="BMI" value="24.5" min="10" max="50" required>

                    <label>Systolic BP (mmHg)</label>
                    <input type="number" name="SystolicBP" value="120" min="80" max="200" required>

                    <label>Diastolic BP (mmHg)</label>
                    <input type="number" name="DiastolicBP" value="80" min="50" max="120" required>

                    <label>Serum Creatinine (mg/dL)</label>
                    <input type="number" step="0.1" name="SerumCreatinine" value="1.0" min="0.5" max="15" required>

                    <label>BUN Levels (mg/dL)</label>
                    <input type="number" step="0.1" name="BUNLevels" value="18.0" min="5" max="50" required>

                    <label>GFR</label>
                    <input type="number" step="0.1" name="GFR" value="90.0" min="10" max="120" required>

                    <label>Hemoglobin (g/dL)</label>
                    <input type="number" step="0.1" name="HemoglobinLevels" value="14.0" min="5" max="17" required>

                    <label>Protein in Urine (g/day)</label>
                    <input type="number" step="0.1" name="ProteinInUrine" value="0.0" min="0" max="10" required>
                </div>

                <div class="col-50">
                    <label>Sodium (mEq/L)</label>
                    <input type="number" step="0.1" name="SerumElectrolytesSodium" value="138.0" min="120" max="155" required>

                    <label>Potassium (mEq/L)</label>
                    <input type="number" step="0.1" name="SerumElectrolytesPotassium" value="4.3" min="2.5" max="6.5" required>

                    <label>Calcium (mg/dL)</label>
                    <input type="number" step="0.1" name="SerumElectrolytesCalcium" value="9.5" min="6" max="11" required>

                    <label>Phosphorus (mg/dL)</label>
                    <input type="number" step="0.1" name="SerumElectrolytesPhosphorus" value="4.0" min="2" max="6" required>

                    <label>Smoking</label>
                    <select name="Smoking">
                        <option value="yes">Yes</option>
                        <option value="no">No</option>
                    </select>

                    <label>Alcohol Consumption</label>
                    <select name="AlcoholConsumption">
                        <option value="yes">Yes</option>
                        <option value="no">No</option>
                    </select>

                    <label>Diabetes</label>
                    <select name="Diabetes">
                        <option value="yes">Yes</option>
                        <option value="no">No</option>
                    </select>

                    <label>Hypertension</label>
                    <select name="Hypertension">
                        <option value="yes">Yes</option>
                        <option value="no">No</option>
                    </select>

                    <label>Edema (Swelling)</label>
                    <select name="Edema">
                        <option value="yes">Yes</option>
                        <option value="no">No</option>
                    </select>

                    <label>Fatigue Level (1-10)</label>
                    <input type="number" name="FatigueLevels" value="4" min="1" max="10" required>
                </div>
            </div>

            <button type="submit">🔍 Predict CKD Status</button>
        </form>

        {% if prediction %}
            <div class="result 
                {% if prediction == 'No CKD Detected' %}success{% elif 'Error' in prediction %}error{% else %}warning{% endif %}">
                <p><strong>Prediction:</strong> {{ prediction }}</p>
                {% if proba %}
                    <p><strong>Probability:</strong> {{ '%.2f'|format(proba) }}</p>
                {% endif %}
            </div>
        {% endif %}

        <div class="footer">
            <p>© 2025 NephroPredict | Early CKD Detection</p>
        </div>
    </div>
</body>
</html>
